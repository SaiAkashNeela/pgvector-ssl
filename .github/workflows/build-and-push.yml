# Builds and publishes the image to GHCR on every merge to main.
# Tags per Postgres major: exact (<pgvector>-pg<major>), floating
# (pg<major>), plus `latest` on the default major.
name: build and push

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.pgvector"
      - "*.sh"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/saiakashneela/pgvector-ssl
  DEFAULT_PG_MAJOR: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_major: [16, 17, 18]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: meta
        run: |
          set -euo pipefail
          ver=$(grep -E '^ARG PGVECTOR_VERSION=' Dockerfile.pgvector | cut -d= -f2)
          {
            echo "version=$ver"
            echo "tags<<EOF"
            echo "${REGISTRY_IMAGE}:${ver}-pg${{ matrix.pg_major }}"
            echo "${REGISTRY_IMAGE}:pg${{ matrix.pg_major }}"
            if [ "${{ matrix.pg_major }}" = "$DEFAULT_PG_MAJOR" ]; then
              echo "${REGISTRY_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pgvector
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PGVECTOR_VERSION=${{ steps.meta.outputs.version }}
            PG_MAJOR=${{ matrix.pg_major }}
          tags: ${{ steps.meta.outputs.tags }}
